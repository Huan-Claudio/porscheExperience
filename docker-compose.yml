version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: porsche_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0816
      POSTGRES_DB: porsche_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - porsche_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: maven:3.8-openjdk-17 as builder
    working_dir: /backend
    volumes:
      - ./backend:/backend
    command: mvn clean package -DskipTests
    networks:
      - porsche_network

networks:
  porsche_network:
    driver: bridge

volumes:
  postgres_data:
